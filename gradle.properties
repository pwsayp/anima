org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# --- Версии платформы (общие для ядра и всех модов) -----------------------
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
forge_version=26.2-65.1.0
forge_version_range=[65,)
loader_version_range=[65,)

# --- Ядро -----------------------------------------------------------------
# Диапазон, который моды указывают зависимостью на ядро. Внутри мажорной версии ядро
# только дополняется, поэтому верхняя граница — следующая мажорная.
anima_version=1.0.0
anima_version_range=[1.0,2.0)

# Метаданные конкретного мода (mod_id, версия, описание) лежат в <мод>/build.gradle

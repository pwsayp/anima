modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Ядро семейства. Обязательное и отдельным файлом: если его нет, Forge скажет об этом сам.
[[dependencies.${mod_id}]]
    modId="anima"
    mandatory=true
    versionRange="${anima_version_range}"
    ordering="AFTER"
    side="BOTH"

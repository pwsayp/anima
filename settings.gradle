plugins {
    // Позволяет Gradle самому скачать нужный JDK (25), если его нет в системе
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'anima'

// Ядро. Обязательная зависимость каждого мода семейства и отдельный jar: внутрь модов
// оно не вкладывается, игрок скачивает его сам.
include 'core'

// Моды добавляются сюда по мере появления. Папки-группы — только раскладка по смыслу,
// собственного build.gradle у них нет:
//
//   fauna/  всё живое: звери, птицы, насекомые
//   flora/  всё растущее: культуры, деревья, лес
//   world/  сам мир: тропинки, погода, жажда, люди
//
// Уровень ровно один. Делить группу дальше — только когда в ней больше десятка модов и
// линия раздела очевидна: вложенность удлиняет пути и задачи, а спорам «жук это животное
// или нет» конца нет.

include 'fauna:locusts'
include 'fauna:crows'

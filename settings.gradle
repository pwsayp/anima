plugins {
    // Позволяет Gradle самому скачать нужный JDK (25), если его нет в системе
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'anima'

// Ядро. Обязательная зависимость каждого мода семейства и отдельный jar: внутрь модов
// оно не вкладывается, игрок скачивает его сам.
include 'core'

// Моды добавляются сюда по мере появления. Папки-группы (animals/, crops/ и прочие) —
// только раскладка по смыслу, собственного build.gradle у них нет.

include 'animals:locusts'
include 'animals:crows'
